# Distill 已确认策略导出
# 集群: kind-local-e2e
# 命名空间筛选: 全集群
# 本文件命名空间: argocd
# 时间窗: 2026-08-24T11:21:05Z ~ 2026-08-24T11:36:05Z
# dry-run WOULD_BREAK: 25
# dry-run WOULD_OPEN: 0
# dry-run UNCHANGED: 7
# dry-run UNKNOWN: 30
# 策略文档: 1 份，启用规则: 0 条
# 以上 dry-run 计数是整集群口径，不是本命名空间的影响。
# 导出者: admin
# 导出时刻: 2026-08-24T11:58:35Z
# 以上 dry-run 结论算的是导出这一刻的集群状态，不是应用这一刻的。
# 集群在此之后发生的变化不在其中；应用前请重新导出并核对这几个数字。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-argocd-repo-server-ingress
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes:
  - Ingress
