# Distill 已确认策略导出
# 集群: kind-local-e2e
# 命名空间筛选: 全集群
# 本文件命名空间: probe-open
# 时间窗: 2026-08-24T09:51:44Z ~ 2026-08-24T09:51:53Z
# dry-run WOULD_BREAK: 17
# dry-run WOULD_OPEN: 0
# dry-run UNCHANGED: 7
# dry-run UNKNOWN: 49
# 策略文档: 1 份，启用规则: 2 条
# 以上 dry-run 计数是整集群口径，不是本命名空间的影响。
# 导出者: admin
# 导出时刻: 2026-08-24T09:54:04Z
# 以上 dry-run 结论算的是导出这一刻的集群状态，不是应用这一刻的。
# 集群在此之后发生的变化不在其中；应用前请重新导出并核对这几个数字。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-srv
  namespace: probe-open
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.96.0.1/32
  podSelector:
    matchLabels:
      app: srv
  policyTypes:
  - Ingress
  - Egress
