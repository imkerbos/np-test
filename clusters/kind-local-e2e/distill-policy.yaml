# Distill 已确认策略导出
# 集群: kind-local-e2e
# 命名空间筛选: 全集群
# 时间窗: 2026-08-23T08:20:18Z ~ 2026-08-23T08:20:27Z
# dry-run WOULD_BREAK: 0
# dry-run WOULD_OPEN: 0
# dry-run UNCHANGED: 0
# dry-run UNKNOWN: 11
# 策略文档: 12 份，启用规则: 25 条
# 导出者: admin
# 导出时刻: 2026-08-23T08:20:51Z
# 以上 dry-run 结论算的是导出这一刻的集群状态，不是应用这一刻的。
# 集群在此之后发生的变化不在其中；应用前请重新导出并核对这几个数字。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-worker
  namespace: batch
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.96.0.1/32
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
  - Ingress
  - Egress
