# 一个集群一个 Application，由根 Application（app-of-apps）纳管。
#
# kube-system.yaml 被显式排除：那一份里的 candidate-kube-dns 的 ingress 不含
# 53 端口，应用它会切断整个集群的 DNS。平台的 dry-run 已经把这件事算进
# WOULD_BREAK，这里排除它是**人做的决定**，不是平台悄悄跳过的一步。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distill-kind-local-e2e
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imkerbos/np-test.git
    targetRevision: gitops-demo
    path: clusters/kind-local-e2e/distill
    directory:
      recurse: false
      exclude: 'kube-system.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true      # 仓库里删掉的策略，集群里也删掉
      selfHeal: true   # 有人手工改了集群，拉回仓库里的样子
    syncOptions:
      - CreateNamespace=false
